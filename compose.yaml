name: illusi

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-illusi}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-illusi}
  MEDIA_DIR: /data/media
  ANALYZER_TMP_DIR: /data/analyzer_tmp
  ANALYZER_URL: http://analyzer:8765
  TRUST_PROXY: loopback, uniquelocal
  APP_VERSION: ${API_TAG:-latest}

x-app: &app
  image: ${API_IMAGE:-ghcr.io/illusion137/illusi-api}:${API_TAG:-latest}
  env_file: .env
  volumes:
    - ${DATA_DIR:-./data}/media:/data/media
    - ${DATA_DIR:-./data}/analyzer_tmp:/data/analyzer_tmp
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  logging: *logging

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.11.6
    ports:
      - "80:80"
      - "443:443"
    environment:
      DEFAULT_HOST: ${DOMAIN:?set DOMAIN in .env}
      # Serve /.well-known/acme-challenge/ from /usr/share/nginx/html (certbot's webroot), also over HTTP before a cert exists.
      ACME_HTTP_CHALLENGE_LOCATION: "true"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./deploy/nginx/conf.d/illusi.conf:/etc/nginx/conf.d/illusi.conf:ro
      - ${DATA_DIR:-./data}/certs:/etc/nginx/certs:ro
      - ${DATA_DIR:-./data}/letsencrypt:/etc/letsencrypt:ro
      - ${DATA_DIR:-./data}/acme:/usr/share/nginx/html
    restart: unless-stopped
    logging: *logging

  # Let's Encrypt via certbot (Python), HTTP-01 webroot challenges served by nginx-proxy.
  # One-shot: scripts/ssl.sh issue|renew (renew runs from a systemd timer installed by preinstall).
  certbot:
    image: certbot/certbot:v5.8.0
    profiles: [tools]
    volumes:
      - ${DATA_DIR:-./data}/letsencrypt:/etc/letsencrypt
      - ${DATA_DIR:-./data}/acme:/var/www/acme

  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-illusi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-illusi}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    # Loopback only: reachable from the VPS (backups, ssh tunnels), never from outside.
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  api:
    <<: *app
    environment:
      <<: *app-env
      VIRTUAL_HOST: ${DOMAIN:?set DOMAIN in .env}
      VIRTUAL_PORT: "3000"
      PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 3
    # Must exceed SHUTDOWN_GRACE_MS so in-flight requests finish before SIGKILL.
    stop_grace_period: 35s

  worker:
    <<: *app
    command: ["node", "--import", "tsx", "src/worker/reconcile.ts"]
    environment:
      <<: *app-env
    healthcheck:
      disable: true
    stop_grace_period: 60s

  # One-shot, run by scripts/deploy.sh before the rollout.
  migrate:
    <<: *app
    profiles: [tools]
    command: ["node", "--import", "tsx", "src/db/migrate.ts"]
    environment:
      <<: *app-env
    healthcheck:
      disable: true
    restart: "no"

  analyzer:
    image: ${ANALYZER_IMAGE:-ghcr.io/illusion137/illusi-analyzer}:${ANALYZER_TAG:-latest}
    environment:
      # Only reachable on the compose network (no published port).
      ANALYZER_URL: http://0.0.0.0:8765
      ANALYZER_ALLOW_REMOTE: "1"
      ANALYZER_PATH_ROOTS: /data/analyzer_tmp:/data/media
    volumes:
      # Same absolute paths as in the api container: the API sends absolute file paths.
      - ${DATA_DIR:-./data}/media:/data/media:ro
      - ${DATA_DIR:-./data}/analyzer_tmp:/data/analyzer_tmp:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
    restart: unless-stopped
    logging: *logging
