# Included at http{} level by nginx-proxy, next to its generated default.conf.

# Media uploads are up to MEDIA_MAX_BYTES (200 MiB) plus multipart overhead.
client_max_body_size 210m;
client_body_timeout 120s;

# Analyzer-backed and lyrics requests can take a while; uploads stream slowly on mobile and are encoded before the
# response. A client that still times out resends: the API answers retried pushes and uploads from what it stored.
proxy_read_timeout 600s;
proxy_send_timeout 600s;

# During a rollout the stopping replica refuses new connections; nginx then retries the request on
# the other replica. That's safe for every method because a refused connection never reached the app.
# Until nginx-proxy re-renders after the old container exits, its IP is gone and connects just hang,
# so fail those fast too (containers on the same host connect in well under a millisecond).
proxy_next_upstream error timeout;
proxy_next_upstream_tries 3;
proxy_connect_timeout 2s;

server_tokens off;

# Every request gets nginx's id (also in nginx-proxy's access log); the API logs it, tags Sentry events with it and
# returns it as X-Request-Id. A client-sent X-Request-Id is replaced so nginx and API logs always match.
proxy_set_header X-Request-Id $request_id;

# Compress API responses. nginx-proxy's template already sets gzip_types (it includes application/json and no
# audio types), so it isn't repeated here. Proxied requests are compressed too (gzip_proxied).
gzip on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_vary on;

# Request limits, shared by every API replica and applied per vhost in vhost.d/default. limit_req doesn't count an
# empty key, which is how a zone skips requests.
map $request_uri $is_media {
	default 0;
	~^/api/v1/media/ 1;
}

# Per client: the bearer token when there is one, so people behind one carrier NAT or campus network each get their
# own budget; the IP otherwise. Media streams (many range requests per track) are limited separately below.
map "$is_media:$http_authorization" $client_limit_key {
	default $http_authorization;
	"~^1:" "";
	"0:" $binary_remote_addr;
}
limit_req_zone $client_limit_key zone=per_client:32m rate=240r/m;

# Per IP across everything but media, much looser: a backstop against clients inventing a new Authorization header per request.
map $is_media $ip_limit_key {
	default $binary_remote_addr;
	1 "";
}
limit_req_zone $ip_limit_key zone=per_ip:10m rate=1200r/m;

# Media streaming per IP: players fetch ranges as they play and seek.
map $is_media $media_limit_key {
	default "";
	1 $binary_remote_addr;
}
limit_req_zone $media_limit_key zone=media_per_ip:10m rate=1200r/m;

# Sign-in, registration and email confirmation are limited much harder: 10 requests per minute per IP. Other paths get an
# empty key, which limit_req doesn't count. Applied per vhost in vhost.d/default.
map $request_uri $auth_limit_key {
	default "";
	~^/api/v1/auth/ $binary_remote_addr;
}
limit_req_zone $auth_limit_key zone=auth_per_ip:10m rate=10r/m;
