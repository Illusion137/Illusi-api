# Included at http{} level by nginx-proxy, next to its generated default.conf.

# Media uploads are up to MEDIA_MAX_BYTES (200 MiB) plus multipart overhead.
client_max_body_size 210m;
client_body_timeout 120s;

# Analyzer-backed and lyrics requests can take a while; uploads stream slowly on mobile.
proxy_read_timeout 120s;
proxy_send_timeout 120s;

# During a rollout the stopping replica refuses new connections; nginx then retries the request on
# the other replica. That's safe for every method because a refused connection never reached the app.
# Until nginx-proxy re-renders after the old container exits, its IP is gone and connects just hang,
# so fail those fast too (containers on the same host connect in well under a millisecond).
proxy_next_upstream error timeout;
proxy_next_upstream_tries 3;
proxy_connect_timeout 2s;

server_tokens off;
